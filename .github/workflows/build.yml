name: Build

on:
  push:
    # Files that change neither the game nor the site.
    paths-ignore:
      - README.md
      - CREDITS.md
      - merch/**
      - tools/make_merch*
  pull_request:
  workflow_dispatch:

# A newer push replaces a build still running on the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          tag="${GODOT_VERSION}-${GODOT_RELEASE}"
          base="https://github.com/godotengine/godot/releases/download/${tag}"
          curl -fsSL -o godot.zip "${base}/Godot_v${tag}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${base}/Godot_v${tag}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${tag}_linux.x86_64" /usr/local/bin/godot
          tpl_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$tpl_dir"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$tpl_dir/"
          rm -rf godot.zip templates.tpz tpl

      - name: Configure Android SDK and debug keystore
        run: |
          minor="${GODOT_VERSION%.*}"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${minor}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/ci/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import assets
        run: |
          godot --headless --import
          grep -H "mipmaps/generate" assets/textures/*.import

      - name: Smoke test (fails on script errors)
        run: |
          # The loading screen (which opens the menu), the armory, then 15 s of the game scene.
          godot --headless --fixed-fps 60 --quit-after 300 2>&1 | tee run.log
          godot --headless --fixed-fps 60 --quit-after 60 res://scenes/armory.tscn 2>&1 | tee -a run.log
          godot --headless --fixed-fps 60 --quit-after 60 res://scenes/battle_pass.tscn 2>&1 | tee -a run.log
          godot --headless --fixed-fps 60 --quit-after 120 res://scenes/shop.tscn 2>&1 | tee -a run.log
          godot --headless --fixed-fps 60 --quit-after 120 res://scenes/cards.tscn 2>&1 | tee -a run.log
          godot --headless --fixed-fps 60 --quit-after 120 res://scenes/lobby.tscn 2>&1 | tee -a run.log
          godot --headless --fixed-fps 60 --quit-after 60 res://scenes/tools/poster.tscn 2>&1 | tee -a run.log
          godot --headless --fixed-fps 60 --quit-after 900 res://scenes/main.tscn 2>&1 | tee -a run.log
          # Flying enemies (from wave 3) and close-combat enemies (jungle).
          godot --headless --fixed-fps 60 --quit-after 900 res://scenes/main.tscn -- --arena=2 --start-wave=4 2>&1 | tee -a run.log
          # Elites, snipers and kamikazes (from waves 2, 4 and 6).
          godot --headless --fixed-fps 60 --quit-after 1500 res://scenes/main.tscn -- --start-wave=7 2>&1 | tee -a run.log
          # Each of the other arenas, 5 s of game time.
          for arena in 1 2 3 4; do
            godot --headless --fixed-fps 60 --quit-after 300 res://scenes/main.tscn -- --arena=$arena 2>&1 | tee -a run.log
          done
          # Each boss wave, 20 s of game time.
          for wave in 5 10 15 20 25; do
            godot --headless --fixed-fps 60 --quit-after 1200 res://scenes/main.tscn -- --start-wave=$wave 2>&1 | tee -a run.log
          done
          # Zone capture: a whole match's first minute on two arenas.
          for arena in 0 3; do
            godot --headless --fixed-fps 60 --quit-after 3600 res://scenes/capture.tscn -- --arena=$arena 2>&1 | tee -a run.log
          done
          # The ship race: a whole race (3 laps, about 95 s), the player idle.
          godot --headless --fixed-fps 60 --quit-after 6600 res://scenes/race.tscn 2>&1 | tee -a run.log
          # Local network: a host and a guest on this machine, a race then a capture.
          for mode in race capture; do
            timeout 60 godot --headless --fixed-fps 60 res://scenes/lobby.tscn -- --host=$mode > host.log 2>&1 &
            sleep 3
            # The guest gets its own home, hence its own save file: two games
            # writing one save at the same time can read it half written.
            HOME="$PWD/guest_home" timeout 55 godot --headless --fixed-fps 60 res://scenes/lobby.tscn -- --join=127.0.0.1 > guest.log 2>&1 || true
            wait
            cat host.log guest.log | tee -a run.log > /dev/null
          done
          # Shop content: each exotic gun, animated skin and boosted ultimate,
          # trigger held down, ultimate fired after 5 s.
          save_dir="$HOME/.local/share/godot/app_userdata/Overclock"
          mkdir -p "$save_dir"
          owned='["kunoichi", "captain", "ronin", "paladin", "godfather", "sand_ghost", "laser", "railgun", "plasma", "flamer", "flechette", "minigun", "skin_holo", "skin_galaxy", "skin_plasma", "skin_glitch", "skin_prism"]'
          for combo in "kunoichi laser skin_holo" "captain railgun skin_galaxy" "ronin plasma skin_plasma" \
              "paladin flamer skin_glitch" "godfather flechette skin_prism" "sand_ghost minigun skin_holo"; do
            set -- $combo
            printf '[loadout]\ncharacter="%s"\nweapon="%s"\nskin="%s"\n[progress]\nowned=%s\n' "$1" "$2" "$3" "$owned" > "$save_dir/save.cfg"
            godot --headless --fixed-fps 60 --quit-after 900 res://scenes/main.tscn -- --start-wave=3 --autofire --ulti 2>&1 | tee -a run.log
          done
          rm "$save_dir/save.cfg"
          # The trailer's whole timeline, without drawing it.
          godot --headless --fixed-fps 30 --quit-after 4700 res://scenes/tools/trailer.tscn 2>&1 | tee -a run.log
          # The same for each anime episode.
          for scene in scenes/tools/anime/ep*.tscn; do
            godot --headless --fixed-fps 30 --quit-after 3800 "res://$scene" 2>&1 | tee -a run.log
          done
          # "still in use at exit" only reports the music playing when --quit-after stops the game.
          # Enemies must be able to walk up to every deck.
          # The check quits by itself; the time limit only guards against a hang.
          timeout 600 godot --headless --fixed-fps 60 res://scenes/tools/nav_check.tscn 2>&1 | tee -a run.log
          grep "^NAV" run.log
          if grep -q "^NAV FAIL" run.log; then exit 1; fi
          if grep -E "SCRIPT ERROR|Parse Error|^ERROR:" run.log | grep -v "still in use at exit"; then exit 1; fi

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
          ls -lh build/web/

      - name: Export debug APK
        run: |
          godot --headless --export-debug "Android" build/overclock-debug.apk
          test -f build/overclock-debug.apk
          ls -lh build/overclock-debug.apk

      - uses: actions/upload-artifact@v5
        with:
          name: overclock-web
          path: build/web/

      - uses: actions/upload-artifact@v5
        with:
          name: overclock-debug-apk
          path: build/overclock-debug.apk

      # Test APKs go to the public overclock-builds repo, as a release whose
      # download link never changes.
      - name: Publish "latest-debug" release to overclock-builds (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.BUILDS_TOKEN }}
          BUILDS_REPO: mariusortiz/overclock-builds
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::BUILDS_TOKEN secret missing, APK not published"
            exit 0
          fi
          gh release delete latest-debug --repo "$BUILDS_REPO" --yes --cleanup-tag || true
          gh release create latest-debug build/overclock-debug.apk \
            --repo "$BUILDS_REPO" \
            --prerelease \
            --title "Dernière version de test" \
            --notes "APK debug généré automatiquement depuis le commit ${GITHUB_SHA::7}."

      # The code repo is private, so the web build goes to the public overclock-builds
      # repo, served by GitHub Pages from its gh-pages branch.
      # BUILDS_TOKEN: fine-grained token with Contents read/write on overclock-builds only.
      - name: Publish web build to overclock-builds gh-pages (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.BUILDS_TOKEN }}
          BUILDS_REPO: mariusortiz/overclock-builds
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::BUILDS_TOKEN secret missing, web build not published"
            exit 0
          fi
          site="$RUNNER_TEMP/site"
          cp -r build/web "$site"
          touch "$site/.nojekyll"
          # Custom domain (a CNAME record points it to mariusortiz.github.io).
          echo "overclock.randomlabs.dev" > "$site/CNAME"
          # Earlier builds installed a caching service worker: this file takes its
          # place and removes it (see tools/remove_service_worker.js).
          cp tools/remove_service_worker.js "$site/index.service.worker.js"
          # The one-page website (site/), next to the game: https://overclock.randomlabs.dev/site/
          mkdir -p "$site/site"
          cp -r site/index.html site/boutique.html site/boutique.json site/img site/kenney_mini_square_mono.ttf "$site/site/"
          cd "$site"
          git init -q -b gh-pages
          # The trailer and the anime are published by their own workflows: carry them over.
          url="https://x-access-token:${GH_TOKEN}@github.com/${BUILDS_REPO}.git"
          if git fetch -q --depth 1 "$url" gh-pages; then
            git checkout -q FETCH_HEAD -- trailer.mp4 trailer.html 2>/dev/null || true
            git checkout -q FETCH_HEAD -- trailer.jpg 2>/dev/null || true
            git checkout -q FETCH_HEAD -- ':(glob)anime*' 2>/dev/null || true
          fi
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Web build from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${BUILDS_REPO}.git" gh-pages
