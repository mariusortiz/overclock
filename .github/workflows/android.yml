name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5.1"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # needed to publish the "latest-debug" release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          tag="${GODOT_VERSION}-${GODOT_RELEASE}"
          base="https://github.com/godotengine/godot/releases/download/${tag}"
          curl -fsSL -o godot.zip "${base}/Godot_v${tag}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${base}/Godot_v${tag}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${tag}_linux.x86_64" /usr/local/bin/godot
          tpl_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$tpl_dir"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$tpl_dir/"
          rm -rf godot.zip templates.tpz tpl

      - name: Configure Android SDK and debug keystore
        run: |
          minor="${GODOT_VERSION%.*}"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${minor}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/ci/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat ~/.config/godot/editor_settings-${minor}.tres

      - name: Import assets
        run: godot --headless --import

      - name: Smoke test (fails on script errors)
        run: |
          godot --headless --quit-after 120 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|Parse Error" run.log; then exit 1; fi

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/overclock-debug.apk
          test -f build/overclock-debug.apk
          ls -lh build/

      - uses: actions/upload-artifact@v5
        with:
          name: overclock-debug-apk
          path: build/overclock-debug.apk

      - name: Publish "latest-debug" release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug build/overclock-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dernière version de test" \
            --notes "APK debug généré automatiquement depuis ${GITHUB_SHA::7}."
