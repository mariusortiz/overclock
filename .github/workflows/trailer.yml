name: Trailer

# Renders the trailer with Godot's movie mode and publishes it next to the web
# build. Runs only when the trailer itself changes, or by hand.
on:
  push:
    branches: [main]
    paths:
      - scripts/trailer.gd
      - tools/trailer_music.mp3
      - scenes/tools/trailer.tscn
      - tools/trailer.html
      - .github/workflows/trailer.yml
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5.1"
  GODOT_RELEASE: "stable"

jobs:
  trailer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot, a virtual display and ffmpeg
        run: |
          tag="${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${tag}/Godot_v${tag}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${tag}_linux.x86_64" /usr/local/bin/godot
          rm godot.zip
          # The runner's package mirror has been unreachable for hours at a time, so
          # nothing here depends on it: xvfb and Mesa ship with the runner image, and
          # ffmpeg comes as a static build from GitHub.
          if ! command -v xvfb-run >/dev/null; then
            sudo timeout 300 apt-get update -q
            sudo timeout 600 apt-get install -y -q --no-install-recommends xvfb libgl1-mesa-dri
          fi
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL -o ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            tar -xf ffmpeg.tar.xz
            sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
            rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-gpl
          fi
          ffmpeg -version | head -1

      - name: Import assets
        run: godot --headless --import

      # No graphics card here: the picture is drawn by the processor (OpenGL),
      # one frame at a time, so the film is smooth however long it takes.
      - name: Render
        run: |
          # --quit-after: the film is 3600 frames; stop anyway if the script stalls.
          xvfb-run -a -s "-screen 0 1920x1080x24" godot --rendering-driver opengl3 --audio-driver Dummy \
            --resolution 1920x1080 --fixed-fps 30 --quit-after 3700 --write-movie "$RUNNER_TEMP/trailer.avi" \
            res://scenes/tools/trailer.tscn 2>&1 | tee render.log
          if grep -E "SCRIPT ERROR|Parse Error" render.log; then exit 1; fi
          ls -lh "$RUNNER_TEMP/trailer.avi"

      # One piece of music over the whole film, starting 12 s into the track so
      # that it kicks in when the tour of the arenas begins.
      - name: Encode
        run: |
          ffmpeg -y -loglevel error -i "$RUNNER_TEMP/trailer.avi" -ss 12 -i tools/trailer_music.mp3 \
            -map 0:v -map 1:a -t 120 \
            -af "afade=t=in:d=1.5,afade=t=out:st=115:d=5,loudnorm=I=-14:TP=-1.5" \
            -c:v libx264 -preset medium -crf 22 -maxrate 3M -bufsize 6M -pix_fmt yuv420p \
            -c:a aac -b:a 192k -movflags +faststart trailer.mp4
          ffmpeg -y -loglevel error -ss 4 -i trailer.mp4 -frames:v 1 -q:v 3 trailer.jpg
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 trailer.mp4

      - uses: actions/upload-artifact@v5
        with:
          name: overclock-trailer
          path: |
            trailer.mp4
            trailer.jpg

      - name: Publish to overclock-builds gh-pages
        env:
          GH_TOKEN: ${{ secrets.BUILDS_TOKEN }}
          BUILDS_REPO: mariusortiz/overclock-builds
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::BUILDS_TOKEN secret missing, trailer not published"
            exit 0
          fi
          url="https://x-access-token:${GH_TOKEN}@github.com/${BUILDS_REPO}.git"
          # The web build may replace the branch meanwhile: try again on top of it.
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/site"
            git clone -q --depth 1 --branch gh-pages "$url" "$RUNNER_TEMP/site"
            cp trailer.mp4 trailer.jpg tools/trailer.html "$RUNNER_TEMP/site/"
            git -C "$RUNNER_TEMP/site" add trailer.mp4 trailer.jpg trailer.html
            git -C "$RUNNER_TEMP/site" -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
              commit -q -m "Trailer from ${GITHUB_SHA::7}"
            if git -C "$RUNNER_TEMP/site" push -q "$url" gh-pages; then exit 0; fi
            sleep 20
          done
          exit 1
